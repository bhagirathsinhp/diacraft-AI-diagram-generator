<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>DiaCraft</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles.css') }}"
    />
    <script src="{{ url_for('static', filename='main.js') }}" defer></script>
  </head>

  <body class="dark-mode">
    <!-- Main application container -->
    <div class="app">
      <header class="app-header">
        <h1>DiaCraft</h1>
      </header>

      <main class="app-main">
        <!-- Form section for user input and diagram configuration -->
        <section class="form-section">
          <form class="input-form" id="diagramForm">
            <!-- Textarea for entering requirements -->
            <textarea
              id="inputText"
              placeholder="Enter your requirements here..."
              aria-label="Input your requirements"
            ></textarea>

            <!-- Radio buttons -->
            <fieldset>
              <legend>Select Input Type</legend>
              <label>
                <!-- Default selected radio button -->
                <input
                  type="radio"
                  name="input-type"
                  value="product-requirements"
                  checked
                />
                Product Requirements (UML)
              </label>

              <!-- Radio button for non-programming diagrams -->
              <label>
                <input type="radio" name="input-type" value="non-programming" />
                Non-Programming Diagram Requirements
              </label>
            </fieldset>

            <!-- Diagram selection, populated dynamically -->
            <fieldset>
              <legend>Select Diagram Type</legend>
              <select id="diagramType"></select>
            </fieldset>
            <button type="submit" id="generateBtn">Generate Diagram</button>
          </form>

          <!-- Loading message while diagram is generated -->
          <div
            id="loadingMessage"
            class="loading-message"
            style="display: none"
          >
            Generating your diagram...
          </div>
          <!-- Error message section for validation or server errors -->
          <div class="error" role="alert" id="errorMessage"></div>
        </section>

        <!-- Section for displaying Generated Diagrams and PlantUML syntax -->
        <section
          class="diagram-section"
          id="diagramContainer"
          style="display: none"
        >
          <h2>Generated Diagram</h2>
          <!-- Container for generated diagram image -->
          <div class="diagram-wrapper">
            <img id="diagramImage" alt="Generated UML Diagram" />
          </div>

          <!-- Button to download Generated Diagram -->
          <div class="diagram-actions">
            <button id="downloadDiagram">Download Diagram</button>
          </div>

          <!-- Container displaying Generated PlantUML syntax -->
          <div class="uml-syntax-section">
            <h3 class="PlantUMLHeader">Generated PlantUML Syntax</h3>
            <textarea id="plantUMLSyntax" readonly></textarea>
            <!-- Button to download PlantUML syntax -->
            <button id="copySyntaxBtn">Copy PlantUML Syntax</button>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
